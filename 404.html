<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>404 Not Found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="404 Not Found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
    }

    main.error .error-message {
      color: var(--brand-primary);
    }

    main.error .error-text {
      font-size: var(--body-font-size-m);
    }

    main.error .error-button-home {
      color: var(--link-color);
      font-size: var(--body-font-size-m);
      font-weight: 400;
      text-decoration: none;
    }

    main.error .error-button-home:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <h2 class="error-message">We're Sorry</h2>
      <p class="error-text">That page does not seem to exist on this site. Please try navigating to another page or use the search box.</p>
      <p>
        <a href="/" class="error-button-home">Return home</a>.
      </p>
    </div>
    <div class="section">
      <p><a href="/fragments/isi">/fragments/isi</a></p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
